name: Validate Streamlit app (manual approval to publish image)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned app requirements
        run: python -m pip install -r app/requirements.txt

      - name: Validate CSV, charts, dashboard, and deployment setup
        run: |
          python scripts/preflight.py --strict
          python -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build uniquely tagged linux/amd64 image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_REF="${IMAGE_NAME}:${TAG}"
          docker buildx build --platform linux/amd64 --load -t "${IMAGE_REF}" .
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test image before publishing
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          docker run -d --name adhd-serve-smoke -p 8501:8501 "${IMAGE_REF}"
          trap 'docker logs adhd-serve-smoke || true; docker rm -f adhd-serve-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit container health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit container did not become healthy"
          exit 1

      - name: Publish validated image to GHCR
        if: github.event_name == 'workflow_dispatch'
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deployment image reference
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo '## SciLifeLab Serve image reference'
            echo
            echo '```text'
            echo '${{ steps.image.outputs.ref }}'
            echo '```'
            echo
            echo 'Make the GHCR package public and use this exact unique tag in Serve (not latest).'
          } >> "$GITHUB_STEP_SUMMARY"
